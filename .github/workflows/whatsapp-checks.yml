name: WhatsApp integration checks
on:
  pull_request:
    paths: ['supabase/**', 'whatsapp-inbox.*', 'tests/whatsapp*', 'index.html', '.github/workflows/whatsapp-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: whatsapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/whatsapp.test.cjs
      - name: Check SQL transactions and RLS
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d whatsapp_test -v ON_ERROR_STOP=1 -f tests/whatsapp-schema.sql
